[project]
name = "edaloop"
version = "0.1.0"
description = "Evidence ledger and gate controller that joins atopile, KiCad, routers, SPICE and EM solvers into one design loop for agents"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "numpy>=2",
    "scikit-rf>=1.5",
    "mcp>=2.3",
    "shapely>=2.2.0",
]

[project.scripts]
edaloop = "edaloop.cli:main"
edaloop-mcp = "edaloop.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edaloop"]
artifacts = ["src/edaloop/agent/*", "src/edaloop/spice_models/*", "src/edaloop/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
# kicad_ops.py and export_eagle.py run under KiCad's own Python 3.9, so nothing
# here may suggest syntax newer than that: no UP rules, no zip(strict=).
target-version = "py39"

[tool.ruff.lint]
# Correctness first. Style families can join once the code is clean under them.
select = ["F", "E4", "E7", "E9", "B", "BLE", "I", "PLE", "RUF100"]
ignore = [
    "B905",   # zip(strict=) needs Python 3.10
    "E731",   # a named lambda is used deliberately for short local helpers
    "E741",   # l for layer, as KiCad names it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
