<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1150 552' role='img' aria-label='The stages in order: describe, place, ground, route RF, route power, route signal, finish, verify, simulate, evaluate and release, with the command, tool, output and checks for each.' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><rect width='1150' height='552' fill='#0d1117' rx='8'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#a3aeba'/></marker></defs><text x='30.0' y='34.0' font-size='18' fill='#e6edf3' text-anchor='start' font-weight='600'>The stages, in order</text><text x='30.0' y='54.0' font-size='13' fill='#a3aeba' text-anchor='start' font-weight='400'>Run edaloop stage NAME to check a stage before moving on. edaloop next names whatever needs doing.</text><text x='66.0' y='82.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='600'>Stage</text><text x='182.0' y='82.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='600'>Command</text><text x='392.0' y='82.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='600'>Tool</text><text x='606.0' y='82.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='600'>Writes</text><text x='806.0' y='82.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='600'>Checked by</text><rect x='30' y='92' width='1040' height='36' rx='5' fill='#2b2110'/><circle cx='48' cy='110' r='11' fill='#e6edf3'/><text x='48.0' y='114.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>1</text><text x='66.0' y='115.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Describe</text><text x='182.0' y='115.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop describe</text><text x='392.0' y='115.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>edaloop</text><text x='606.0' y='115.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Board description (YAML)</text><text x='806.0' y='115.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>bench</text><rect x='30' y='132' width='1040' height='36' rx='5' fill='#12263a'/><circle cx='48' cy='150' r='11' fill='#e6edf3'/><text x='48.0' y='154.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>2</text><text x='66.0' y='155.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Place</text><text x='182.0' y='155.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop build</text><text x='392.0' y='155.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>KiCad</text><text x='606.0' y='155.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Placed board, schematic, pours</text><text x='806.0' y='155.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>rf_path</text><rect x='30' y='172' width='1040' height='36' rx='5' fill='#12263a'/><circle cx='48' cy='190' r='11' fill='#e6edf3'/><text x='48.0' y='194.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>3</text><text x='66.0' y='195.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Ground</text><text x='182.0' y='195.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop ground</text><text x='392.0' y='195.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>KiCad</text><text x='606.0' y='195.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Welded vias, maker&#x27;s patterns</text><text x='806.0' y='195.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>reports any shortfall</text><rect x='30' y='212' width='1040' height='36' rx='5' fill='#2d1519'/><circle cx='48' cy='230' r='11' fill='#e6edf3'/><text x='48.0' y='234.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>4</text><text x='66.0' y='235.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Route RF</text><text x='182.0' y='235.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop route --by-class</text><text x='392.0' y='235.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>edaloop</text><text x='606.0' y='235.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Straight, locked RF copper</text><text x='806.0' y='227.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>rf_path, rf_preserved,</text><text x='806.0' y='242.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>rf_reference, impedance</text><rect x='30' y='252' width='1040' height='36' rx='5' fill='#2d1519'/><circle cx='48' cy='270' r='11' fill='#e6edf3'/><text x='48.0' y='274.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>5</text><text x='66.0' y='275.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Route power</text><text x='182.0' y='275.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>(same command)</text><text x='392.0' y='275.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>KiCadRoutingTools</text><text x='606.0' y='275.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Rails, on an inner layer</text><text x='806.0' y='267.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>power, thermal_field,</text><text x='806.0' y='282.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>drc</text><rect x='30' y='292' width='1040' height='36' rx='5' fill='#2d1519'/><circle cx='48' cy='310' r='11' fill='#e6edf3'/><text x='48.0' y='314.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>6</text><text x='66.0' y='315.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Route signal</text><text x='182.0' y='315.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>(same command)</text><text x='392.0' y='315.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>KiCadRoutingTools</text><text x='606.0' y='315.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Everything else</text><text x='806.0' y='315.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>drc, rf_preserved</text><rect x='30' y='332' width='1040' height='36' rx='5' fill='#12263a'/><circle cx='48' cy='350' r='11' fill='#e6edf3'/><text x='48.0' y='354.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>7</text><text x='66.0' y='355.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Finish</text><text x='182.0' y='355.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop finish</text><text x='392.0' y='355.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>KiCad</text><text x='606.0' y='355.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Fence, stitching, refilled pours</text><text x='806.0' y='355.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>DRC removes any bad via</text><rect x='30' y='372' width='1040' height='36' rx='5' fill='#12261b'/><circle cx='48' cy='390' r='11' fill='#e6edf3'/><text x='48.0' y='394.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>8</text><text x='66.0' y='395.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Verify</text><text x='182.0' y='395.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop run all</text><text x='392.0' y='395.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>kicad-cli, circuitRF, boardfield</text><text x='606.0' y='395.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Evidence</text><text x='806.0' y='387.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>erc, drc,</text><text x='806.0' y='402.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>rules, rf_layout, power, thermal_field</text><rect x='30' y='412' width='1040' height='36' rx='5' fill='#12261b'/><circle cx='48' cy='430' r='11' fill='#e6edf3'/><text x='48.0' y='434.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>9</text><text x='66.0' y='435.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Simulate</text><text x='182.0' y='435.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>(same command)</text><text x='392.0' y='435.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>EMerge, openEMS, Palace, ngspice</text><text x='606.0' y='435.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Evidence</text><text x='806.0' y='427.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>em_hops, em_crosscheck,</text><text x='806.0' y='442.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>cascade, spice</text><rect x='30' y='452' width='1040' height='36' rx='5' fill='#12261b'/><circle cx='48' cy='470' r='11' fill='#e6edf3'/><text x='48.0' y='474.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>10</text><text x='66.0' y='475.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Evaluate</text><text x='182.0' y='475.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop status</text><text x='392.0' y='475.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>edaloop</text><text x='606.0' y='475.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Gate state, next action</text><text x='806.0' y='475.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>requirements</text><rect x='30' y='492' width='1040' height='36' rx='5' fill='#2b2110'/><circle cx='48' cy='510' r='11' fill='#e6edf3'/><text x='48.0' y='514.0' font-size='12' fill='#0d1117' text-anchor='middle' font-weight='600'>11</text><text x='66.0' y='515.0' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='600'>Release</text><text x='182.0' y='515.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400' font-family='SFMono-Regular,Menlo,Consolas,monospace'>edaloop release</text><text x='392.0' y='515.0' font-size='12' fill='#a3aeba' text-anchor='start' font-weight='400'>kicad-cli</text><text x='606.0' y='515.0' font-size='12' fill='#e6edf3' text-anchor='start' font-weight='400'>Fabrication files</text><text x='806.0' y='515.0' font-size='11.5' fill='#a3aeba' text-anchor='start' font-weight='400'>refuses unless the gate holds</text><path d='M1086 510 L1108 510 L1108 110 L1074 110' fill='none' stroke='#a3aeba' stroke-width='1.5' stroke-dasharray='5 4' marker-end='url(#a)'/><text transform='translate(1122 302) rotate(90)' font-size='12' fill='#a3aeba' text-anchor='middle'>a failure goes back to the stage that can fix it</text></svg>
