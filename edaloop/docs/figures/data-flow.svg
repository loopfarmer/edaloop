<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 910 550' role='img' aria-label='Data flow: a description or schematic is built into a KiCad project. Routers work on copies. Checks measure the files and record results in a ledger. The gate reads the ledger and either names the next action or allows release.' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><rect width='910' height='550' fill='#ffffff' rx='8'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5f6b7a'/></marker></defs><text x='30.0' y='34.0' font-size='18' fill='#1f2933' text-anchor='start' font-weight='600'>How data moves through edaloop</text><text x='30.0' y='54.0' font-size='13' fill='#5f6b7a' text-anchor='start' font-weight='400'>Every result is tied to a hash of the files it measured, so changing a file retires what was said about it.</text><rect x='30' y='80' width='180' height='66' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='120.0' y='102.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Written description</text><text x='120.0' y='121.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>parts, nets, RF path (YAML)</text><rect x='30' y='170' width='180' height='66' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='120.0' y='192.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Existing schematic</text><text x='120.0' y='211.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>edaloop describe</text><rect x='280' y='125' width='150' height='66' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='355.0' y='147.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>edaloop build</text><text x='355.0' y='166.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>places and draws</text><rect x='500' y='110' width='170' height='96' rx='6' fill='#eaf2f8' stroke='#1f6f8b'/><text x='585.0' y='132.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>KiCad project</text><text x='585.0' y='151.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>board and schematic</text><text x='585.0' y='167.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>edaloop.yaml</text><text x='585.0' y='183.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>chain spec</text><rect x='730' y='110' width='150' height='96' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='805.0' y='132.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Routers</text><text x='805.0' y='151.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>work on copies</text><text x='805.0' y='167.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>adopted only if RF</text><text x='805.0' y='183.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>copper holds</text><rect x='500' y='280' width='170' height='80' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='585.0' y='302.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Checks</text><text x='585.0' y='321.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>one authority</text><text x='585.0' y='337.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>for each question</text><rect x='730' y='280' width='150' height='80' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='805.0' y='302.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Tools</text><text x='805.0' y='321.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>KiCad, circuitRF,</text><text x='805.0' y='337.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>ngspice, EM solvers</text><rect x='280' y='280' width='150' height='80' rx='6' fill='#eef7f1' stroke='#2f855a'/><text x='355.0' y='302.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Evidence ledger</text><text x='355.0' y='321.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>result + input hashes</text><rect x='280' y='430' width='150' height='80' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='355.0' y='452.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Gate</text><text x='355.0' y='471.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>still the same bytes?</text><text x='355.0' y='487.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>all checks hold?</text><rect x='500' y='430' width='170' height='80' rx='6' fill='#f3f5f8' stroke='#c5ccd6'/><text x='585.0' y='452.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>next_action</text><text x='585.0' y='471.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>says what to fix or run</text><text x='585.0' y='487.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>agent or person acts</text><rect x='730' y='430' width='150' height='80' rx='6' fill='#eef7f1' stroke='#2f855a'/><text x='805.0' y='452.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Release</text><text x='805.0' y='471.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>fab files, only if</text><text x='805.0' y='487.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>the gate holds</text><rect x='30' y='430' width='180' height='80' rx='6' fill='#fdf6e7' stroke='#b7791f'/><text x='120.0' y='452.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>A person</text><text x='120.0' y='471.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>owns requirements</text><text x='120.0' y='487.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>and named waivers</text><path d='M210 113 L250 113 L250 150 L278 150' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><path d='M210 203 L250 203 L250 166 L278 166' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><path d='M430 158 L498 158' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><path d='M670 142 L728 142' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='699.0' y='134.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>copy</text><path d='M728 174 L672 174' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='699.0' y='192.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>adopt</text><path d='M585 206 L585 278' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='577.0' y='247.0' font-size='12' fill='#5f6b7a' text-anchor='end' font-weight='400'>reads the files</text><path d='M670 320 L728 320' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='711.0' y='312.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>runs</text><path d='M498 320 L432 320' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='465.0' y='312.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>records</text><path d='M355 360 L355 428' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='363.0' y='399.0' font-size='12' fill='#5f6b7a' text-anchor='start' font-weight='400'>reads</text><path d='M430 470 L498 470' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='464.0' y='462.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>fails</text><path d='M430 496 L462 496 L462 530 L805 530 L805 512' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='640.0' y='524.0' font-size='12' fill='#5f6b7a' text-anchor='middle' font-weight='400'>holds</text><path d='M670 470 L686 470 L686 245 L640 245 L640 208' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)'/><text x='694.0' y='392.0' font-size='12' fill='#5f6b7a' text-anchor='start' font-weight='400'>changes the design</text><path d='M120 430 L120 262 L530 262 L530 208' fill='none' stroke='#5f6b7a' stroke-width='1.5' marker-end='url(#a)' stroke-dasharray="5 4"/><text x='128.0' y='256.0' font-size='12' fill='#5f6b7a' text-anchor='start' font-weight='400'>requirements and waivers go in edaloop.yaml</text></svg>
