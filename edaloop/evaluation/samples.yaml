# Known-good production boards used to test edaloop. Adafruit designs its boards and ships them as products.
# Their design files are CC BY-SA 3.0 and stay in Adafruit's repositories: `edaloop eval` fetches each at the pinned commit.
# The RF boards at the end come from other projects, under the licence each entry names, and are fetched the same way. None is stored here.
# `known` holds what each board's own files or README state. Anything else the evaluation assumes is under `assumed`.
# Adafruit's Fritzing parts for these boards, used as a second opinion on pins and pad positions.
fritzing_commit: c7bbe2d58a78ebc7b3499351c0f77356cd701c96
