# A description of a real board, not its design files: no layout, so routing and EM can't run from it.
name: cband_element
summary: >-
  One-channel C-band receive board with two LNA stages: highpass, limiter, LNA, interstage filter and
  pi pad, second LNA, lowpass, then a bias-T that takes its 5 V from the output cable.
band_mhz: [3700, 4140]
supply_v: 5.0
outline_mm: [61.7, 18]
stackup:
  copper_um: [35, 15.2, 15.2, 35]
  dielectric_mm: [0.2104, 1.065, 0.2104]
  epsilon_r: 4.3
  loss_tangent: 0.02
rf_line_width_mm: 0.36     # solved to 49.8 ohm on a coupon with this stackup and a 0.3 mm pour gap

parts:
  J1: {value: U.FL input}
  FL1: {value: highpass, mpn: HFCN-2700+}
  U1: {value: limiter, mpn: RLM-63-2W+}
  C1: {value: 4.7pF, mpn: GJM1555C1H4R7BB01}
  U2: {value: LNA, mpn: PMA2-63LN+}
  L1: {value: 12nH, mpn: 0603HP-12N}
  C2: {value: 4.7pF, mpn: GJM1555C1H4R7BB01}
  FL2: {value: highpass, mpn: HFCN-3100+}
  RP1: {value: 0R, note: pi pad series}
  RP2: {value: DNP, dnp: true, note: pi pad shunt}
  RP3: {value: DNP, dnp: true, note: pi pad shunt}
  L2: {value: 18nH, mpn: LQG15HS18N}
  U3: {value: LNA, mpn: PMA3-83LN+}
  L3: {value: 12nH, mpn: 0603HP-12N}
  C3: {value: 4.7pF, mpn: GJM1555C1H4R7BB01}
  FL3: {value: lowpass, mpn: LFCN-5000+}
  C4: {value: 4.7pF, mpn: GJM1555C1H4R7BB01}
  L4: {value: 12nH, mpn: 0603HP-12N}
  J2: {value: U.FL output and DC feed}
  C5: {value: 3.3pF}
  C6: {value: 1uF}
  R1: {value: 0R}
  C7: {value: 3.3pF}
  C8: {value: 10nF}
  R3: {value: 0R}
  C9: {value: 3.3pF}
  C10: {value: 100nF}
  RT1: {value: 2k2, note: NTC at 25 C, telemetry leg}
  R2: {value: 1k0}

nets:
  ANT: [J1.1, FL1.1]
  HPF2LIM: [FL1.3, U1.1]
  LIM: [U1.4, C1.1]
  LNA1IN: [C1.2, U2.3]
  LNA1OUT: [U2.6, L1.1, C2.1]
  IS1: [C2.2, FL2.1]
  IS2: [FL2.3, RP2.1, RP1.1]
  IS3: [RP1.2, RP3.1, L2.1, U3.2]
  LNA2OUT: [U3.8, L3.1, C3.1]
  LP_IN: [C3.2, FL3.1]
  LP_OUT: [FL3.3, C4.1]
  COAX: [C4.2, L4.1, J2.1]
  BIAS1: [L1.2, C5.1, C6.1, R1.2]
  BIAS2: [L3.2, C7.1, C8.1, R3.2]
  VDD: [L4.2, C9.1, C10.1, R1.1, R3.1, RT1.1]
  TSENSE: [RT1.2, R2.1]
  GND: [J1.2, J2.2, FL1.2, FL1.4, FL3.2, FL3.4, FL2.2, FL2.4, FL2.5, FL2.6, U1.2, U1.3, U1.5, U1.6,
        U2.2, U2.4, U2.5, U2.7, U2.8, U2.9, U3.1, U3.3, U3.4, U3.5, U3.6, U3.7, U3.9, U3.10, U3.13,
        RP2.2, RP3.2, L2.2, C5.2, C6.2, C7.2, C8.2, C9.2, C10.2, R2.2]
# Left open on purpose. U2.1 sets the LNA's current, and open means 44 mA.
open_pins: [U2.1, U3.11, U3.12]

chain:
  - [ANT, J1.1, FL1.1]
  - [HPF2LIM, FL1.3, U1.1]
  - [LIM, U1.4, C1.1]
  - [LNA1IN, C1.2, U2.3]
  - [LNA1OUT, U2.6, C2.1]
  - [IS1, C2.2, FL2.1]
  - [IS2, FL2.3, RP1.1]
  - [IS3, RP1.2, U3.2]
  - [LNA2OUT, U3.8, C3.1]
  - [LP_IN, C3.2, FL3.1]
  - [LP_OUT, FL3.3, C4.1]
  - [COAX, C4.2, J2.1]

# Bias stacks, laid straight like the RF so that the supply meets the bulk capacitor before the RF bypass.
extra_chains:
  - [BIAS1, L1.2, R1.2]
  - [BIAS2, L3.2, R3.2]

# The design's own table at one frequency, including the cable ahead of the board.
design_table:
  freq_mhz: 3920
  rows:
    - {stage: input cable, gain_db: -1.15, nf_db: 1.15, cum_gain_db: -1.15, cum_nf_db: 1.15}
    - {stage: J1 and 12 mm of trace, gain_db: -0.37, nf_db: 0.37, cum_gain_db: -1.52, cum_nf_db: 1.52}
    - {stage: FL1, gain_db: -0.83, nf_db: 0.83, cum_gain_db: -2.35, cum_nf_db: 2.35}
    - {stage: U1, gain_db: -0.29, nf_db: 0.29, cum_gain_db: -2.65, cum_nf_db: 2.65}
    - {stage: U2, gain_db: 14.84, nf_db: 0.69, cum_gain_db: 12.19, cum_nf_db: 3.34}
    - {stage: FL2, gain_db: -0.85, nf_db: 0.85, cum_gain_db: 11.34, cum_nf_db: 3.37}
    - {stage: RP1 pi pad, gain_db: 0.0, nf_db: 0.0, cum_gain_db: 11.34, cum_nf_db: 3.37}
    - {stage: U3, gain_db: 20.80, nf_db: 1.50, cum_gain_db: 32.14, cum_nf_db: 3.43}
    - {stage: FL3, gain_db: -0.50, nf_db: 0.50, cum_gain_db: 31.65, cum_nf_db: 3.43}
    - {stage: DC blocks and 19 mm of trace, gain_db: -0.52, nf_db: 0.52, cum_gain_db: 31.13, cum_nf_db: 3.43}

spice:
  models:
    FL1: {kind: open, reason: "RF filter; the RF path is the cascade's job"}
    FL2: {kind: open, reason: "RF filter; the RF path is the cascade's job"}
    FL3: {kind: open, reason: "RF filter; the RF path is the cascade's job"}
    U1: {kind: open, reason: "limiter ahead of the LNA, carries no bias"}
    RP2: {kind: open, reason: "not fitted"}
    RP3: {kind: open, reason: "not fitted"}
    RT1: {kind: value, value: 2.2k, reason: "NTC at 25 C"}
    J1: {kind: open, reason: "input connector"}
    J2: {kind: open, reason: "the bench drives the cable node directly"}
  bench:
    name: bias
    stimulus:
      - "Vcable COAX 0 DC 5"
      - "Rleak1 ANT 0 1G"
      - "Rleak2 HPF2LIM 0 1G"
      - "Rleak3 LIM 0 1G"
      - "Rleak4 IS1 0 1G"
      - "Rleak5 LP_IN 0 1G"
      - "Rleak6 LP_OUT 0 1G"
    measure:
      - ".control"
      - "op"
      - "let v_lna1 = v(lna1out)"
      - "let v_lna2 = v(lna2out)"
      - "let v_tsense = v(tsense)"
      - "let i_total_ma = -i(vcable)*1000"
      - "print v_lna1 v_lna2 v_tsense i_total_ma"
      - "quit"
      - ".endc"
  # Worked by hand: 44 mA and 60 mA LNAs, plus 5 V across 2.2k + 1k in the telemetry leg.
  expect:
    v_lna1: {value: 5.0, tol: 0.01}
    v_lna2: {value: 5.0, tol: 0.01}
    v_tsense: {value: 1.5625, tol: 0.001}
    i_total_ma: {value: 105.56, tol: 0.05}

# How the board is laid out. Rotations and positions are derived from the nets and the footprints' courtyards.
layout:
  axis: x
  line: 10.0
  gap_mm: 0.1
  pour_clearance_mm: 0.3
  # RF nets keep the solved width and neck down only at fine-pitch pins, so that a whole hop isn't high impedance.
  net_width: {BIAS1: 0.30, BIAS2: 0.30}
  footprints:
    J1: Connector_Coaxial:U.FL_Hirose_U.FL-R-SMT-1_Vertical
    J2: Connector_Coaxial:U.FL_Hirose_U.FL-R-SMT-1_Vertical
    FL1: RFLib_FP:LFCN_FV1206
    FL3: RFLib_FP:LFCN_FV1206
    FL2: CBandLib_FP:HFCN_FV1206-1
    U1: RFLib_FP:RLM_TT1224
    U2: CBandLib_FP:MC1631-1
    U3: CBandLib_FP:DQ1225
    C1: Capacitor_SMD:C_0402_1005Metric
    C2: Capacitor_SMD:C_0402_1005Metric
    C3: Capacitor_SMD:C_0402_1005Metric
    C4: Capacitor_SMD:C_0402_1005Metric
    C5: Capacitor_SMD:C_0402_1005Metric
    C6: Capacitor_SMD:C_0402_1005Metric
    C7: Capacitor_SMD:C_0402_1005Metric
    C8: Capacitor_SMD:C_0402_1005Metric
    C9: Capacitor_SMD:C_0402_1005Metric
    C10: Capacitor_SMD:C_0402_1005Metric
    L1: Inductor_SMD:L_0603_1608Metric
    L3: Inductor_SMD:L_0603_1608Metric
    L4: Inductor_SMD:L_0603_1608Metric
    L2: Inductor_SMD:L_0402_1005Metric
    R1: Resistor_SMD:R_0402_1005Metric
    R2: Resistor_SMD:R_0402_1005Metric
    R3: Resistor_SMD:R_0402_1005Metric
    RT1: Resistor_SMD:R_0402_1005Metric
    RP1: Resistor_SMD:R_0402_1005Metric
    RP2: Resistor_SMD:R_0402_1005Metric
    RP3: Resistor_SMD:R_0402_1005Metric
  ground:
    # Vias inside each LNA's paddle, as the parts' suggested layouts show.
    paddle: {U3.13: [2, 3], U2.9: [1, 2]}
    per_pad: {U1: 2, U3: 1, U2: 1}
    stitch_pitch_mm: 3.0

# What edaloop.yaml needs beyond the netlist.
project:
  eps_eff: 3.25
  line_loss_db_per_mm: 0     # the stage table already counts its copper
  em: {at_ghz: 3.92, fmax_ghz: 6}
  rails:
    - {net: VDD, source: L4.2, loads: {R1.1: 0.044, R3.1: 0.060, RT1.1: 0.00156}, max_drop_mv: 50}
