[package]
name = "boardhand"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "MCP server through which an AI agent safely reads and edits KiCad 10 board files"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "boardhand"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
debug = false
