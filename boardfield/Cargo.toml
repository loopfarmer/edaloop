[package]
name = "boardfield"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Board current and temperature fields from a board's own copper"
publish = false

[dependencies]
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[profile.release]
opt-level = 3
